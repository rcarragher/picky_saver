name: E2E Tests (Self-Hosted)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-ios:
    name: Maestro E2E (iOS)
    runs-on: [self-hosted, macOS]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify runner prerequisites
        run: |
          echo "--- Checking prerequisites ---"
          xcodebuild -version
          xcrun simctl list runtimes
          pod --version
          maestro --version
          convert --version
          exiftool -ver

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Cache CocoaPods
        uses: actions/cache@v6
        with:
          path: ios/Pods
          key: pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: pods-

      - name: Install CocoaPods
        run: cd ios && pod install

      - name: Boot iOS simulator
        run: |
          # Shutdown any lingering simulator from a previous run
          xcrun simctl shutdown booted 2>/dev/null || true

          # Find an iPhone 16 simulator
          DEVICE_UDID=$(xcrun simctl list devices available -j | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              if 'iOS' in runtime:
                  for d in devices:
                      if 'iPhone 16' in d['name'] and d['isAvailable']:
                          print(d['udid'])
                          sys.exit(0)
          sys.exit(1)
          ")
          echo "Booting simulator $DEVICE_UDID..."
          xcrun simctl boot "$DEVICE_UDID"
          echo "Waiting for simulator to finish booting..."
          xcrun simctl bootstatus "$DEVICE_UDID" -b

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Maestro artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-results
          path: ~/.maestro/tests/
          retention-days: 7

      - name: Shutdown simulator
        if: always()
        run: xcrun simctl shutdown booted || true
