name: Build iOS (Local)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS build profile'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - preview
          - production

concurrency:
  group: build-ios
  cancel-in-progress: false

jobs:
  build:
    name: Build iOS (${{ inputs.profile }})
    runs-on: [self-hosted, macOS]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      - name: Build with EAS (local)
        run: npx eas-cli build --platform ios --profile ${{ inputs.profile }} --local --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-${{ inputs.profile }}-${{ github.sha }}
          path: |
            *.tar.gz
            *.ipa
          retention-days: 14
