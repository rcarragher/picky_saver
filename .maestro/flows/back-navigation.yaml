appId: com.pickysaver.app
---

# Back Navigation Flow
# Test back button navigation through the app's screens:
# Home → Date Picker → (back) → Home
# Home → Date Picker → Swipe → (back) → Date Picker → (back) → Home

- launchApp

# Verify home screen
- assertVisible: "Picky Saver"

# Navigate to date picker
- tapOn: "Start organizing your photos"
- assertVisible: "Pick a Month"

# Go back to home
- tapOn: "Go back"
- extendedWaitUntil:
    visible: "Picky Saver"
    timeout: 5000

# Navigate to date picker again, then into a month
- tapOn: "Start organizing your photos"
- assertVisible: "Pick a Month"
- extendedWaitUntil:
    visible: ".*photos.*"
    timeout: 10000
- tapOn:
    index: 0
    text: ".*photos.*"

# Dismiss onboarding if shown
- tapOn:
    text: ".*Dismiss onboarding.*"
    optional: true

# Verify we're on the swipe screen (photo card or month name visible)
- extendedWaitUntil:
    visible:
      id: "photo-card"
    timeout: 5000

# Go back to date picker
- tapOn: "Go back"
- extendedWaitUntil:
    visible: "Pick a Month"
    timeout: 5000

# Go back to home
- tapOn: "Go back"
- extendedWaitUntil:
    visible: "Picky Saver"
    timeout: 5000
