appId: com.pickysaver.app
---

# Grant Permissions Flow
# Verify that with granted permissions, the home screen loads correctly
# with the "Start Organizing" button visible.

- launchApp:
    permissions:
      photos: allow

# Verify home screen is visible with permissions granted
- extendedWaitUntil:
    visible: "Picky Saver"
    timeout: 10000

# Verify the main CTA is visible
- assertVisible: ".*Start Organizing.*"

# Verify subtitle text
- assertVisible: ".*Organize your photos.*"
