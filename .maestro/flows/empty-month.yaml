appId: com.pickysaver.app
---

# Empty Month Flow
# Navigate to a month with no photos, verify empty state UI.
#
# Note: This flow navigates directly via deep link to a month
# that has no seeded photos (e.g., April 2025).
# If deep linking is not available, this flow tests the empty state
# by navigating through the UI to a month that exists but has been
# fully processed already.

- launchApp

# Home screen
- assertVisible: "Picky Saver"
- tapOn: "Start organizing your photos"

# Date picker
- assertVisible: "Pick a Month"
- extendedWaitUntil:
    visible: ".*photos.*"
    timeout: 10000

# Select a month — after swipe-all-photos has cleared March,
# navigating to March again should show the empty state.
# Alternatively, the test data only has Jan/Feb/Mar, so
# if any month was fully swiped, re-entering it shows empty.
- tapOn:
    index: 0
    text: ".*photos.*"

# Dismiss onboarding if shown
- tapOn:
    text: ".*Dismiss onboarding.*"
    optional: true

# If the month has photos, this flow verifies photo-card is visible.
# The empty state test is most reliable when run after swipe-all-photos
# has cleared a month.
# Verify either the photo card or the empty state appears
- extendedWaitUntil:
    visible: ".*"
    timeout: 5000
